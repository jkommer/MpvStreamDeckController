<!DOCTYPE html>
<html>
<head lang="en">
    <meta charset="utf-8" />
    <script src="sdpi-components.js"></script>
    <style>
        details * {
            font-size: 12px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            color: #9a9a9a;
        }
    </style>
</head>
<body>
    <sdpi-item label="Command">
        <sdpi-textfield setting="command" placeholder="cycle pause"></sdpi-textfield>
    </sdpi-item>
    <details>
        <summary>Syntax and examples</summary>
        <p>Same format as an mpv <code>input.conf</code> line. Use double quotes for arguments containing spaces.</p>
        <p>
            <code>cycle pause</code><br />
            <code>seek 30 relative</code><br />
            <code>add volume -5</code><br />
            <code>script-message my-script "hello world"</code><br />
            <code>seek 5 relative; cycle mute</code>
        </p>
    </details>
</body>
</html>
