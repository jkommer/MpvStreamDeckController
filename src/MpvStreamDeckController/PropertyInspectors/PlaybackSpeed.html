<!DOCTYPE html>
<html>
<head lang="en">
    <meta charset="utf-8" />
    <script src="sdpi-components.js"></script>
    <script src="scripts.js"></script>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <sdpi-item label="Step">
        <sdpi-textfield setting="playbackSpeedStep" placeholder="0.1" pattern="\d*\.?\d+"></sdpi-textfield>
    </sdpi-item>
    <mpv-osd-select></mpv-osd-select>
    <details>
        <summary>About these settings</summary>
        <p><b>Step</b> is the amount to change the speed by per dial tick, e.g. <code>0.10</code> or <code>0.20</code>. Empty or invalid values use 0.10.</p>
        <p>The playback speed never goes below 0.01 or above 100.</p>
    </details>
</body>
</html>
