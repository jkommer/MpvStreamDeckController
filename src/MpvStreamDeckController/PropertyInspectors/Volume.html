<!DOCTYPE html>
<html>
<head lang="en">
    <meta charset="utf-8" />
    <script src="sdpi-components.js"></script>
    <script src="scripts.js"></script>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <sdpi-item label="Step (%)">
        <sdpi-textfield setting="volumeStep" placeholder="2" pattern="\d*\.?\d+"></sdpi-textfield>
    </sdpi-item>
    <mpv-osd-select></mpv-osd-select>
    <details>
        <summary>About these settings</summary>
        <p><b>Step</b> is the number of volume percentage points to change per dial tick or key press, e.g. <code>2</code> or <code>0.5</code>. Empty or invalid values use 2.</p>
        <p>The volume never goes below 0 or above mpv's volume-max.</p>
    </details>
</body>
</html>
