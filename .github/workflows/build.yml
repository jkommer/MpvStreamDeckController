name: Build
 
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
 
env:
  PLUGIN_ID: com.jkommer.mpv
  PLUGIN_DIR: src/MpvStreamDeckController/bin/Release/com.jkommer.mpv.sdPlugin
 
jobs:
  build: 
    runs-on: windows-latest
 
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0 

    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v4.7.0
      with:
        versionSpec: '6.8.x'
    - name: Determine version
      id: gitversion
      uses: gittools/actions/gitversion/execute@v4.7.0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build -c Release --no-restore -p:Version=${{ steps.gitversion.outputs.semVer }}
    - name: Test
      run: dotnet test -c Release --no-build --verbosity normal 
    
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: lts/*
    - name: Install Stream Deck CLI
      run: npm install -g @elgato/cli@1.10.4
    - name: Validate plugin
      run: streamdeck validate "${{ env.PLUGIN_DIR }}" --no-update-check
    - name: Pack plugin
      run: streamdeck pack "${{ env.PLUGIN_DIR }}" --output dist --no-update-check --no-file-list --version "${{ steps.gitversion.outputs.majorMinorPatch }}.${{ steps.gitversion.outputs.versionSourceDistance }}"
    
    - name: Upload package
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.PLUGIN_ID }}-${{ steps.gitversion.outputs.semVer }}
        path: dist/*.streamDeckPlugin
        if-no-files-found: error